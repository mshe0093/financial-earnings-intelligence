[project]
name = "earnings-intel"
version = "0.1.0"
description = "LLM-powered SEC filing analysis — extract forward-looking signals and backtest post-earnings drift."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "duckdb>=1.1,<2",
    "httpx>=0.27,<1",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5.3,<6",
    "google-genai>=1.0,<2",
    "yfinance>=0.2,<1",
    "fredapi>=0.5,<1",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "gradio>=5.0,<6",
    "pandas>=2.2,<3",
    "plotly>=5.24,<6",
    "tenacity>=9.0,<10",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=5.0,<6",
    "httpx[http2]",
    "pre-commit>=3.8,<4",
    "detect-secrets>=1.5,<2",
    "ruff>=0.6,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/earnings_intel"]

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "S", "B", "A", "RUF"]
# S = bandit security checks

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E501"]
"tests/**" = ["S101", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
