# ============================================================
# Pre-commit hooks — Automated Leak Prevention
# ============================================================
#
# Install:   uv run pre-commit install
# Run all:   uv run pre-commit run --all-files
# Update:    uv run pre-commit autoupdate
#
# ============================================================

repos:
  # ── Standard hygiene hooks ──
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict

  # ── Secret detection — scans staged diffs for API keys, tokens, passwords ──
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args:
          - "--baseline"
          - ".secrets.baseline"
        exclude: |
          (?x)^(
            \.env\.example|
            PROJECT_PLAN\.md|
            uv\.lock
          )$

  # ── Ruff — fast Python linting and formatting ──
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
